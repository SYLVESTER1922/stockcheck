# Test, build and deploy to GitHub Pages on every push to main (ADR 0005).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the app version is the last app-code commit (ADR 0006)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # ADR 0006: prove the live Access Switch matches what was committed. Fails the run if not.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            public/status.json
            scripts/check-live-status.mts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the live status.json matches the committed one
        run: node scripts/check-live-status.mts "${{ steps.deployment.outputs.page_url }}" 120000
